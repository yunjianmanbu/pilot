name: CI

# 桌面端的强制关卡：类型检查 + 单元测试 + 打包前的构建。
# 本地等价命令见 CONTRIBUTING.md：`pnpm typecheck && pnpm test`。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段，不在这里写死
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 依赖锁死：lockfile 漂移应当在本地解决，不要在 CI 里自动更新
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 内置 CLI 的 Web 控制台单独构建，出错时这里会先炸，不必等到打包
      - name: Build server console
        run: pnpm build:server
