<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="476" viewBox="0 0 1040 476" role="img" aria-label="One folder, one loop, three surfaces">
<title>One folder, one loop, three surfaces</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="476" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">One folder, one loop, three surfaces</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">The renderer never touches your files; the agent loop in the main process does</text>
<rect x="40" y="96" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="124" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">RENDERER · ELECTRON + REACT</text><line x1="62" y1="138" x2="324" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="62" y="166" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">chat, plan, diff review, checkpoints</text><text x="62" y="188" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">reads state over IPC, never the disk</text><rect x="367" y="96" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="124" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">AGENT LOOP · MAIN PROCESS</text><line x1="389" y1="138" x2="651" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="389" y="166" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">model → tool call → result → model</text><text x="389" y="188" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">plan, skills, hooks, MCP, memory</text><rect x="694" y="96" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="124" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">WORKSPACE · YOUR FOLDER</text><line x1="716" y1="138" x2="978" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="716" y="166" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">files, git, tests, commands</text><text x="716" y="188" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">writes are patches, runs are recorded</text><rect x="40" y="246" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="274" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">PILOT LINK · PHONE</text><line x1="62" y1="288" x2="324" y2="288" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="62" y="316" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">read sessions, continue a chat</text><text x="62" y="338" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">approve tool calls on the go</text><rect x="367" y="246" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="274" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">PILOT CLIENT · PHONE CONTROL</text><line x1="389" y1="288" x2="651" y2="288" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="389" y="316" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">the desktop drives that device</text><text x="389" y="338" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">typed rc.* calls through six gates</text><rect x="694" y="246" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="274" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">PILOT SERVE · BROWSER</text><line x1="716" y1="288" x2="978" y2="288" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="716" y="316" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">same agent, no window</text><text x="716" y="338" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">localhost console or headless host</text><text x="520" y="240" font-size="14" fill="#4fb6f0" font-weight="400" text-anchor="middle">↕</text><rect x="40" y="400" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="434" font-size="12" fill="#7bf0d0" font-weight="400" text-anchor="start">Cancel, the step budget and the token budget are the only brakes; nothing runs past them.</text>
</svg>
