<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="476" viewBox="0 0 1040 476" role="img" aria-label="一个文件夹、一个循环、三个入口">
<title>一个文件夹、一个循环、三个入口</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="476" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">一个文件夹、一个循环、三个入口</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">渲染进程从不直接碰你的文件，真正执行的是主进程里的智能体循环</text>
<rect x="40" y="96" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="124" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">渲染进程 · ELECTRON + REACT</text><line x1="62" y1="138" x2="324" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="62" y="166" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">对话、计划、diff 审阅、回退点</text><text x="62" y="188" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">只经 IPC 读状态，不读磁盘</text><rect x="367" y="96" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="124" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">智能体循环 · 主进程</text><line x1="389" y1="138" x2="651" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="389" y="166" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">模型 → 工具调用 → 结果 → 模型</text><text x="389" y="188" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">计划、技能、Hooks、MCP、记忆</text><rect x="694" y="96" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="124" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">工作区 · 你的文件夹</text><line x1="716" y1="138" x2="978" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="716" y="166" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">文件、git、测试、命令</text><text x="716" y="188" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">写入是 patch，执行有记录</text><rect x="40" y="246" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="274" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">PILOT LINK · 手机</text><line x1="62" y1="288" x2="324" y2="288" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="62" y="316" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">看会话、接着聊</text><text x="62" y="338" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">随时批准工具调用</text><rect x="367" y="246" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="274" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">PILOT CLIENT · 手机反控</text><line x1="389" y1="288" x2="651" y2="288" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="389" y="316" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">桌面端操作这台设备</text><text x="389" y="338" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">带类型的 rc.* 走六道关卡</text><rect x="694" y="246" width="306" height="130" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="274" font-size="11" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="0.8">PILOT SERVE · 浏览器</text><line x1="716" y1="288" x2="978" y2="288" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="716" y="316" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">同一个智能体，不开窗口</text><text x="716" y="338" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">本机控制台或无界面主机</text><text x="520" y="240" font-size="14" fill="#4fb6f0" font-weight="400" text-anchor="middle">↕</text><rect x="40" y="400" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="434" font-size="12" fill="#7bf0d0" font-weight="400" text-anchor="start">取消、步数预算与 token 预算是循环唯一的刹车，没有别的路径能绕过它们。</text>
</svg>
